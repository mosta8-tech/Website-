<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arbeitskalender</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🗓️</span>
      <span>Arbeitskalender</span>
    </div>
    <nav class="tabs">
      <button class="tab is-active" data-view="calendar">Kalender</button>
      <button class="tab" data-view="appointments">Termine</button>
      <button class="tab" data-view="customers">Kunden</button>
    </nav>
  </header>

  <main class="container">
    <!-- Kalender -->
    <section id="view-calendar" class="view is-active">
      <div class="view-head">
        <h1 id="cal-title">Kalender</h1>
        <div class="cal-nav">
          <button class="btn" id="cal-prev" aria-label="Voriger Monat">‹</button>
          <button class="btn" id="cal-today">Heute</button>
          <button class="btn" id="cal-next" aria-label="Nächster Monat">›</button>
        </div>
      </div>

      <div class="summary-row" id="cal-summary"></div>

      <div class="calendar-wrap">
        <div class="calendar-weekdays">
          <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>
        <div class="calendar-grid" id="cal-grid"></div>
      </div>

      <div class="panel" id="day-panel" hidden>
        <div class="panel-head">
          <h2 id="day-panel-title"></h2>
          <button class="btn btn-primary" id="btn-day-new">+ Termin an diesem Tag</button>
        </div>
        <div id="day-panel-list"></div>
      </div>
    </section>

    <!-- Termine -->
    <section id="view-appointments" class="view">
      <div class="view-head">
        <h1>Termine</h1>
        <button class="btn btn-primary" id="btn-new-appt">+ Neuer Termin</button>
      </div>
      <div class="filter-row">
        <label class="check">
          <input type="checkbox" id="appt-show-past" />
          Vergangene Termine anzeigen
        </label>
      </div>
      <div id="appt-list"></div>
      <p id="appt-empty" class="empty-state">
        Noch keine Termine. Lege mit „+ Neuer Termin“ deinen ersten an.
      </p>
    </section>

    <!-- Kunden -->
    <section id="view-customers" class="view">
      <div class="view-head">
        <h1>Kunden</h1>
        <button class="btn btn-primary" id="btn-new-customer">+ Neuer Kunde</button>
      </div>
      <input type="search" id="customer-search" class="input search" placeholder="Kunden suchen…" />
      <div id="customer-list"></div>
      <p id="customer-empty" class="empty-state">
        Noch keine Kunden. Lege mit „+ Neuer Kunde“ deinen ersten an.
      </p>
    </section>
  </main>

  <!-- Dialog: Kunde -->
  <dialog id="dlg-customer">
    <form method="dialog" class="dlg-form" id="form-customer">
      <h2 id="dlg-customer-title">Neuer Kunde</h2>
      <label>Name *
        <input type="text" name="name" class="input" required autocomplete="off" />
      </label>
      <label>Telefonnummer
        <input type="tel" name="phone" class="input" autocomplete="off" />
      </label>
      <label>Adresse
        <textarea name="address" class="input" rows="2"></textarea>
      </label>
      <div class="dlg-actions">
        <button type="button" class="btn" data-close>Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog: Termin -->
  <dialog id="dlg-appt">
    <form method="dialog" class="dlg-form" id="form-appt">
      <h2 id="dlg-appt-title">Neuer Termin</h2>
      <div class="grid-2">
        <label>Datum *
          <input type="date" name="date" class="input" required />
        </label>
        <label>Uhrzeit *
          <input type="time" name="time" class="input" required />
        </label>
      </div>
      <label>Kunde *
        <select name="customerId" class="input" id="appt-customer-select" required></select>
      </label>
      <label>Beschreibung / Arbeit
        <input type="text" name="title" class="input" placeholder="z. B. Haarschnitt, Reparatur…" autocomplete="off" />
      </label>
      <fieldset class="fieldset">
        <legend>Nach der Arbeit ausfüllen</legend>
        <div class="grid-2">
          <label>Bezahlung (€)
            <input type="number" name="payment" class="input" min="0" step="0.01" placeholder="0,00" />
          </label>
          <label>Arbeitszeit (Std.)
            <input type="number" name="hours" class="input" min="0" step="0.25" placeholder="z. B. 1,5" />
          </label>
        </div>
      </fieldset>
      <div class="dlg-actions">
        <button type="button" class="btn" data-close>Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
