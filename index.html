<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kleidung Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">👕</span>
      <span>Kleidung&nbsp;Tracker</span>
    </div>
    <nav class="tabs">
      <button class="tab is-active" data-view="orders">Bestellübersicht</button>
      <button class="tab" data-view="stats">Statistik</button>
    </nav>
  </header>

  <main class="container">
    <!-- Bestellübersicht -->
    <section id="view-orders" class="view is-active">
      <div class="view-head">
        <h1>Bestellungen</h1>
        <button class="btn btn-primary" id="btn-new-order">+ Neue Bestellung</button>
      </div>

      <div class="summary-row" id="orders-summary"></div>

      <div id="orders-list" class="orders-list"></div>
      <p id="orders-empty" class="empty-state">
        Noch keine Bestellungen. Lege mit „+ Neue Bestellung“ deine erste an.
      </p>
    </section>

    <!-- Statistik -->
    <section id="view-stats" class="view">
      <div class="view-head">
        <h1>Statistik</h1>
      </div>

      <div class="summary-row" id="stats-cards"></div>

      <div class="panel">
        <h2>Gewinn – letzte 6 Monate</h2>
        <div id="stats-chart" class="chart"></div>
      </div>

      <div class="panel">
        <h2>Weitere Kennzahlen</h2>
        <div class="summary-row" id="stats-extra"></div>
      </div>
    </section>
  </main>

  <!-- Modal: Bestellung anlegen / bearbeiten -->
  <div class="modal-backdrop" id="order-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Neue Bestellung</h2>
        <button class="icon-btn" id="modal-close" aria-label="Schließen">✕</button>
      </div>

      <form id="order-form" class="modal-body">
        <input type="hidden" id="order-id" />

        <div class="grid-2">
          <label class="field">
            <span>Kaufdatum</span>
            <input type="date" id="order-date" required />
          </label>
          <label class="field">
            <span>Gesamtgewicht (g)</span>
            <input type="number" id="order-weight" min="0" step="1" placeholder="z. B. 2000" required />
          </label>
          <label class="field">
            <span>Versandkosten gesamt (€)</span>
            <input type="number" id="order-shipping" min="0" step="0.01" placeholder="z. B. 5.49" required />
          </label>
          <label class="field">
            <span>Bezeichnung (optional)</span>
            <input type="text" id="order-label" placeholder="z. B. Flohmarkt Konvolut" />
          </label>
        </div>

        <div class="items-head">
          <h3>Kleidungsstücke</h3>
          <button type="button" class="btn btn-ghost" id="btn-add-item">+ Kleidungsstück</button>
        </div>

        <div class="items-hint">
          Versandkosten werden automatisch anteilig nach Gewicht auf die Stücke verteilt.
        </div>

        <div id="items-container" class="items-container"></div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Vorlage für eine Kleidungsstück-Zeile -->
  <template id="item-row-template">
    <div class="item-row">
      <div class="item-grid">
        <label class="field">
          <span>Art</span>
          <input type="text" class="i-category" placeholder="T-Shirt, Hose …" />
        </label>
        <label class="field">
          <span>Name</span>
          <input type="text" class="i-name" placeholder="Nike Vintage Tee" />
        </label>
        <label class="field">
          <span>Gewicht (g)</span>
          <input type="number" class="i-weight" min="0" step="1" placeholder="220" />
        </label>
        <label class="field">
          <span>Kaufpreis (€)</span>
          <input type="number" class="i-buy" min="0" step="0.01" placeholder="3.00" />
        </label>
        <label class="field">
          <span>Verkaufspreis (€)</span>
          <input type="number" class="i-sell" min="0" step="0.01" placeholder="25.00" />
        </label>
        <label class="field">
          <span>Verkaufsdatum</span>
          <input type="date" class="i-solddate" />
          <small class="field-hint">leer = noch nicht verkauft</small>
        </label>
      </div>
      <button type="button" class="icon-btn item-remove" aria-label="Kleidungsstück entfernen">🗑</button>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
